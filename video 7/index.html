
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms -Lets learn it</title>
</head>
<body>
    <h1>Form to apply for sigma wev development course -TA</h1>
    <form action="post">
        <div>
            <label for="username">Enter your username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autofocus>
        </div>
        <div>
            <label for="Gender">Enter your Gender</label>
            <input type="radio" id="Male" name = "Gender" value="Male">
            <label for="Male">Male</label>
            <input type="radio" id="Female" name = "Gender" value="Male">
            <label for="Female">Female</label>
        </div>
        <div>
            <input type="checkbox" name="subscribe" id="subscribe" value="yes">
            <label for="subscribe">Subscribe to newsletter</label>
        </div>
        <div>
            <label for="comment">Enter your comment</label>
            <br>
            <textarea name="comment" id="comment" cols="50" rows="4">
            </textarea>
        </div>
        <div>
            <select name="Fruits" id="Fruits">
                <option value="Apple">Apple</option>
                <option value="Banana">Banana</option>
                <option value="Cherry">Cherry</option>
            </select>
        </div>


    </form>
</body>
</html>
